[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daikin-modbus"
version = "0.1.0"
description = "Standalone Daikin/Airzone Aidoo Modbus device library."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Daikin Modbus contributors" }]
keywords = ["modbus", "daikin", "airzone", "aidoo", "hvac"]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = ["modbus-connection>=4.8.1,<5"]

[project.optional-dependencies]
cli = ["modbus-connection[tmodbus]>=4.8.1,<5"]

dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.12"]

[project.urls]
Homepage = "https://github.com/jayg37/daikin-modbus"

[tool.hatch.build.targets.wheel]
packages = ["src/daikin_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
